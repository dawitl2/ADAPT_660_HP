name: Android and PC validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and instrumentation tests, run JVM tests and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: adapt-control-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  pc:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pc/requirements.txt
      - run: python -m unittest discover -s pc -v
